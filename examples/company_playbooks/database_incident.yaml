name: "Database Latency Remediation"
version: "1.2.0"
author: "Site Reliability Team"
description: "Standard Operating Procedure when Postgres query latency spikes above 200ms"
triggers:
  - "database latency"
  - "postgres slow"
  - "high db load"
required_permissions:
  - "metrics:read"
  - "pg_stat_statements:read"
  - "circuit_breaker:override"
steps:
  - step_id: "check_active_locks"
    description: "Inspect pg_stat_activity for exclusive table locks or blocking transactions."
    expected_tool: "check_pg_locks"
    fallback_strategy: "notify_dba_oncall"
  - step_id: "identify_slow_queries"
    description: "Scan pg_stat_statements for top queries by mean_exec_time."
    expected_tool: "get_slow_queries"
    fallback_strategy: "sample_slow_log"
  - step_id: "terminate_idle_in_transaction"
    description: "Terminate transactions idle in transaction for longer than 300 seconds."
    expected_tool: "terminate_backend_connection"
    fallback_strategy: "escalate_to_p1_incident"
