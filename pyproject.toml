[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monoagent-runtime"
version = "0.1.0"
description = "Production enterprise monoagent kernel with shared memory, sandboxed long-running tasks, MCP tooling, and OpenTelemetry observability"
authors = [{ name = "Ibrahim Aliyu Saddique", email = "ibraheemaliyu32@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
